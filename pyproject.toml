[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kodewaspada"
version = "0.3.0"
description = "Evidence-first security review agent and optional JavaScript/TypeScript taint scanner"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "docs/SCANNER.md"

[project.urls]
Repository = "https://github.com/gustiakmal52/kodewaspada"
Issues = "https://github.com/gustiakmal52/kodewaspada/issues"
License = "https://github.com/gustiakmal52/kodewaspada/blob/main/LICENSE"

[project.scripts]
kodewaspada = "kodewaspada.cli:main"

[tool.setuptools.packages.find]
include = ["kodewaspada*"]

[tool.setuptools.package-data]
kodewaspada = ["rules/*.json"]
